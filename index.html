<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d35"><title>FSE Gear Academy</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eaf0fb;background:#0b1220}*{box-sizing:border-box}body{margin:0}header{padding:24px 20px;background:linear-gradient(135deg,#152b50,#0d1629)}h1{font-size:25px;margin:5px 0}h2{font-size:19px}small,.muted{color:#a7b7d0}main{max-width:760px;margin:auto;padding:16px 16px 95px}.panel{background:#152238;border:1px solid #30415d;border-radius:15px;padding:17px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pill{font-size:12px;color:#8fcbff}.bar{height:9px;background:#34445d;border-radius:12px;overflow:hidden}.fill{height:100%;background:#58a6ff}button{background:#2b65ba;color:white;border:0;padding:12px 14px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}button.secondary{background:#26364f}button:disabled{opacity:.5}input,textarea,select{background:#0d192c;border:1px solid #465a78;color:white;border-radius:8px;padding:11px;width:100%;font-size:16px}textarea{min-height:125px}label{display:block;margin:10px 0 5px;color:#c7d5e9;font-size:13px}nav{position:fixed;bottom:0;left:0;right:0;background:#101d31;border-top:1px solid #34445d;display:flex;justify-content:space-around;padding:9px 3px max(12px,env(safe-area-inset-bottom))}nav button{background:transparent;color:#b3c2d8;font-size:12px;padding:8px}nav button.active{color:#72b8ff}article{line-height:1.7}article h3{margin-bottom:6px}article p{margin-top:4px}.option{display:block;width:100%;text-align:left;margin:7px 0;background:#253750}.ok{color:#8ce7b0}.bad{color:#ff9a9a}code{color:#c1e0ff}.section{display:none}.section.active{display:block}.topic{padding:12px;border-bottom:1px solid #30415d}.topic:last-child{border:0}</style></head><body><header><small>개인 학습용 · 비공식 교육 도구</small><h1>⚙️ FSE Gear Academy</h1><div class="muted">100PS Universal · Gear Engineering & Service</div></header><main><section id="home" class="section active"><div class="panel"><div class="row"><strong>학습 진행률</strong><strong id="pct">0%</strong></div><div class="bar" style="margin-top:12px"><div id="fill" class="fill" style="width:0%"></div></div><p class="muted" id="progressText"></p></div><h2>8주 커리큘럼</h2><div id="modules"></div></section><section id="lesson" class="section"><button class="secondary" onclick="show('home')">← 과정 목록</button><h2 id="lessonTitle"></h2><div class="panel"><div class="pill">학습 목표</div><p id="goal"></p></div><article id="content"></article><div class="panel"><label>현장 관찰 및 학습 노트</label><textarea id="note" placeholder="관찰한 부품, 이해한 원리, 추가 확인 사항"></textarea><p class="muted">이 기기 브라우저에 자동 저장됩니다.</p><button onclick="complete()">이 단원 학습 완료</button></div></section><section id="calc" class="section"><h2>기어 계산기</h2><div class="panel"><p class="muted">표준 외접 평기어, 전위 없음. 설계 및 가공 설정에 직접 사용하지 마세요.</p><div class="grid"><div><label>모듈 m (mm)</label><input id="m" type="number" value="2" step="0.1"></div><div><label>잇수 z</label><input id="z" type="number" value="40"></div><div><label>압력각 α (°)</label><input id="a" type="number" value="20"></div></div><p><button onclick="calculate()">계산</button></p><div id="results"></div></div><div class="panel"><strong>기본 공식</strong><p>d = mz<br>dₐ = m(z + 2)<br>dᵦ = d cos α<br>p = πm</p></div></section><section id="quiz" class="section"><h2>이해도 평가</h2><div id="questions"></div><div class="panel" id="score"></div></section><section id="notes" class="section"><h2>학습 기록</h2><div id="allnotes"></div><button onclick="exportNotes()">전체 노트 내보내기</button><p class="muted">브라우저 데이터 삭제 시 기록이 사라질 수 있습니다. 정기적으로 내보내세요.</p></section></main><nav><button onclick="show('home')" id="tab-home">🏠<br>과정</button><button onclick="show('calc')" id="tab-calc">🧮<br>계산</button><button onclick="show('quiz')" id="tab-quiz">📝<br>퀴즈</button><button onclick="show('notes')" id="tab-notes">📒<br>기록</button></nav><script>
const units=[
['기어 공학 기초','모듈, 압력각, 인벌류트 및 정밀도 이해',[['모듈과 기어 크기','모듈 m은 피치원 직경 d를 잇수 z로 나눈 값입니다. 표준 외접 평기어에서 d=mz이며 원주피치는 p=πm입니다.'],['압력각','압력각 α는 피치점에서 작용선과 피치원 접선 사이의 각입니다. 압력각 변화는 치형과 전달력의 방향에 영향을 줍니다.'],['인벌류트','기초원에 감긴 팽팽한 실을 풀 때 실 끝이 그리는 곡선입니다. 일정한 기어비를 유지하는 데 유리한 치형입니다.'],['기어 정밀도','Profile(치형), Lead/Helix(치선), Pitch(피치), Runout(런아웃)을 구분합니다. 측정값과 공구·클램핑·축 운동의 상관관계를 분석합니다.']]],
['기어 절삭 공법','Power Skiving과 Hobbing의 운동학 이해',[['Hobbing','호브와 공작물의 회전 동기화를 이용한 연속 창성 가공입니다. 단순 기본 회전비 크기는 nw=nh×호브 줄 수/공작물 잇수입니다.'],['Power Skiving','교차된 공구축과 공작물축의 상대 운동을 활용하는 창성 가공입니다. 내접기어 가공에도 활용됩니다.'],['100PS Universal','공법 전환 시 공구와 지지 구성의 차이를 관찰합니다. 실제 장비별 옵션 및 작업 절차는 승인된 매뉴얼로 확인해야 합니다.']]],
['100PS Universal 구조','주요 기계 요소의 역할 파악',[['스핀들','공구와 공작물을 회전시키며 런아웃·진동·베어링 상태가 중요합니다.'],['Counter Bearing','호빙 시 공구 지지 강성을 확보하는 요소입니다. 장착·정렬 상태를 확인합니다.'],['Workholding','척·콜릿 등으로 공작물을 고정하며 반복 정밀도와 클램핑 상태가 중요합니다.']]],
['CNC 및 Servo','지령부터 피드백까지 추적',[['CNC','프로그램, 보간, 축 동기화와 가공 경로를 관리합니다.'],['서보 제어','위치 오차 e=r−y. 추종오차가 커질 때 부하, 마찰, 피드백, 드라이브 상태를 비교합니다.'],['엔코더','회전 위치·속도 피드백을 제공합니다. 엔코더 방식은 실제 설치 모델을 확인합니다.']]],
['PLC 및 전기','시퀀스와 인터록 이해',[['PLC','센서 입력과 허가 조건에 따라 밸브, 모터 등 보조 장치를 제어합니다.'],['인터록','도어, 압력, 클램핑 등의 안전·운전 조건을 확인합니다. 우회해서는 안 됩니다.'],['전기 도면','24V DC, 릴레이, 접촉기, I/O 주소와 신호 흐름을 추적합니다.']]],
['보조 시스템','유압·공압·윤활·냉각 계통 파악',[['유압','펌프·밸브·압력 센서·실린더의 관계를 이해합니다.'],['공압','레귤레이터, 솔레노이드 밸브, Sealing Air와 누설 점검을 이해합니다.'],['윤활과 냉각','유량·압력·오염·필터 상태를 점검합니다. 구체적 설정값은 기계 매뉴얼이 기준입니다.']]],
['정밀도 및 유지보수','측정값과 고장 징후 연결',[['런아웃','다이얼 게이지로 회전 편차를 확인하는 기본 개념입니다. 측정 방법과 허용값은 절차서를 따릅니다.'],['정렬','축의 평행도·직각도·동심도 및 열변위를 고려합니다.'],['예방보전','점검 기록을 통해 마모와 성능 변화 추세를 관찰합니다.']]],
['FSE 고장 진단','증상 → 가설 → 검증 → 조치',[['증상 기록','알람 코드, 시점, 공정, 부하, 가공품 측정값을 수집합니다.'],['원인 분리','기계·전기·제어·공구·치구 원인을 분리하여 확인합니다.'],['보고서','현상, 재현 조건, 측정값, 원인, 조치, 검증 결과를 기록합니다.']]]
];
const tests=[['표준 평기어에서 모듈 2 mm, 잇수 40개의 피치원 직경은?',['40 mm','80 mm','120 mm'],1,'d=mz=2×40=80 mm'],['인벌류트 곡선의 기준이 되는 원은?',['기초원','이끝원','이뿌리원'],0,'기초원에서 실을 풀어 생성되는 곡선입니다.'],['호빙 공구 지지에 중요한 요소는?',['Counter Bearing','절삭유 색상','HMI 밝기'],0,'호브의 지지 강성 확보에 기여합니다.'],['Following Error 진단에서 비교할 값은?',['지령 위치와 실제 위치','작업자 수','장비 색상'],0,'e=r−y입니다.'],['윤활 압력 저하 시 올바른 대응은?',['센서 우회','안전 절차에 따른 정지 및 계통 확인','알람 무한 리셋'],1,'윤활 부족 운전은 장비를 손상시킬 수 있습니다.']]];
let active=0;const key='fseacademy_v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{done:[],notes:{},answers:{}}}catch{data={done:[],notes:{},answers:{}}}function save(){localStorage.setItem(key,JSON.stringify(data))}function show(id){document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.id==='tab-'+id));if(id==='home')home();if(id==='quiz')renderQuiz();if(id==='notes')renderNotes();window.scrollTo(0,0)}function home(){let pct=Math.round(data.done.length/units.length*100);document.getElementById('pct').textContent=pct+'%';document.getElementById('fill').style.width=pct+'%';document.getElementById('progressText').textContent=data.done.length+' / '+units.length+' 단원 완료';document.getElementById('modules').innerHTML=units.map((u,i)=>`<div class="panel"><div class="row"><div><span class="pill">${i+1}주차 ${data.done.includes(i)?'✓ 완료':''}</span><h3 style="margin:6px 0">${u[0]}</h3><small>${u[1]}</small></div><button onclick="openLesson(${i})">학습</button></div></div>`).join('')}function openLesson(i){active=i;document.getElementById('lessonTitle').textContent=(i+1)+'단원 · '+units[i][0];document.getElementById('goal').textContent=units[i][1];document.getElementById('content').innerHTML=units[i][2].map((x,j)=>`<div class="panel"><div class="pill">STEP ${j+1}</div><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('');document.getElementById('note').value=data.notes[i]||'';show('lesson')}document.getElementById('note').addEventListener('input',e=>{data.notes[active]=e.target.value;save()});function complete(){if(!data.done.includes(active))data.done.push(active);save();show('home')}function calculate(){let m=+document.getElementById('m').value,z=+document.getElementById('z').value,a=+document.getElementById('a').value;let el=document.getElementById('results');if(!(m>0&&Number.isInteger(z)&&z>=5&&a>0&&a<45)){el.textContent='입력값을 확인하세요.';return}let d=m*z;el.innerHTML=`<p>피치원 직경: <strong>${d.toFixed(3)} mm</strong></p><p>이끝원 직경: <strong>${(m*(z+2)).toFixed(3)} mm</strong></p><p>기초원 직경: <strong>${(d*Math.cos(a*Math.PI/180)).toFixed(3)} mm</strong></p><p>원주 피치: <strong>${(Math.PI*m).toFixed(3)} mm</strong></p>`}function renderQuiz(){document.getElementById('questions').innerHTML=tests.map((t,i)=>`<div class="panel"><strong>${i+1}. ${t[0]}</strong>${t[1].map((v,j)=>`<button class="option" onclick="answer(${i},${j})">${data.answers[i]===j?'●':'○'} ${v}</button>`).join('')}${data.answers[i]===undefined?'':`<p class="${data.answers[i]===t[2]?'ok':'bad'}">${data.answers[i]===t[2]?'정답':'오답'} · ${t[3]}</p>`}</div>`).join('');document.getElementById('score').textContent='정답 '+tests.filter((t,i)=>data.answers[i]===t[2]).length+' / '+tests.length}function answer(i,j){data.answers[i]=j;save();renderQuiz()}function renderNotes(){document.getElementById('allnotes').innerHTML=units.map((u,i)=>`<div class="panel"><strong>${i+1}. ${u[0]}</strong><p style="white-space:pre-wrap">${escapeHTML(data.notes[i]||'기록 없음')}</p></div>`).join('')}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function exportNotes(){let s=units.map((u,i)=>`${i+1}. ${u[0]}\n${data.notes[i]||'기록 없음'}`).join('\n\n');let blob=new Blob([s],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='FSE_학습기록.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}home();calculate();</script></body></html>
