<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1425"><title>FSE Gear Academy · 기어공학 기초</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1425;color:#edf3ff;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}header{padding:28px 18px;background:linear-gradient(135deg,#18365b,#101c30)}h1{font-size:25px;margin:8px 0}h2{font-size:21px}p{line-height:1.75;color:#c6d2e5}main{max-width:780px;margin:auto;padding:16px 16px 95px}.card{background:#17263d;border:1px solid #314765;border-radius:16px;padding:18px;margin:12px 0}.muted{color:#9eb4d0;font-size:13px}.tag{display:inline-block;padding:4px 8px;background:#294a68;border-radius:8px;font-size:12px;margin:5px 0}.btn,button{border:1px solid #5c83ac;background:#254467;color:white;border-radius:10px;padding:11px 13px;font-size:15px;cursor:pointer}.btn:active,button:active{background:#386995}.primary{background:#3b76b0}nav{position:fixed;bottom:0;left:0;right:0;background:#13243a;border-top:1px solid #35506c;display:flex;justify-content:space-around;padding:10px 3px max(14px,env(safe-area-inset-bottom))}nav button{border:0;background:none;font-size:13px;padding:8px 4px}nav button.active{color:#89d0ff}input,textarea{width:100%;padding:12px;background:#0c192b;color:white;border:1px solid #496383;border-radius:10px;font:inherit;margin:6px 0}textarea{min-height:150px}details{background:#17263d;border:1px solid #314765;border-radius:13px;padding:15px;margin:10px 0}summary{font-weight:700;cursor:pointer}small{color:#aabbd1}.answer{border-left:3px solid #7bbaf0;padding:8px 12px;background:#10223b}.good{color:#87e5b0}.bad{color:#ffb3a9}progress{width:100%;height:14px}a{color:#94d4ff}#status{font-size:12px;color:#9bcfff} .diagram{margin:14px 0;padding:10px;border:1px solid #45617e;border-radius:12px;background:#0e2138;text-align:center}.diagram svg{display:block;width:100%;height:auto;max-height:230px}.diagram small{display:block;margin-top:6px;font-size:12px}</style></head><body><header><small>기어공학 · 가공기술 · 도면독해 · 현장용어</small><h1>⚙️ FSE Gear Academy</h1><p style="margin:3px 0">Gear Fundamentals · Machining · Technical English</p><div id="status">기어공학 심화 v4.0 · 로딩 중</div></header><main id="app"><div class="card">학습 자료를 불러오는 중입니다.</div></main><nav><button data-tab="home" class="active">📚 과정</button><button data-tab="calc">🧮 계산</button><button data-tab="quiz">📝 평가</button><button data-tab="cases">🔎 사례</button><button data-tab="notes">📓 기록</button></nav><script>
"use strict";
const DATA={"units":[["기어 구조와 명칭","기어 분류, 치의 각부, 맞물림과 백래시",[["기어의 기능과 분류","기어는 맞물리는 치면의 접촉으로 회전속도·토크·회전방향을 전달한다. 외접 평기어 두 개는 반대 방향으로 회전하고, 내접 기어쌍은 같은 방향으로 회전한다. 기어비는 잇수 비로 결정되지만 전달 효율과 실제 토크는 마찰·손실에 영향을 받는다.\n\n핵심 개념: 동력전달과 기어 형상\n\n필수 영문 용어: Spur / Helical / Internal / Bevel / Worm / Pinion / Driven gear","외접 20T 구동기어가 900 rpm이면 60T 피동기어는 300 rpm, 회전방향은 반대. 이상적 토크는 3배이나 실제는 손실을 고려해야 한다.","현장에서는 축의 교차·평행 여부, 내치/외치, 치선 방향을 먼저 식별한다."],["치의 각 부분","Tooth tip은 치의 최외곽, tooth root는 치와 치 사이 바닥, flank는 동력을 전달하는 치면이다. Addendum은 기준원에서 치끝원까지의 반경 방향 거리, dedendum은 기준원에서 이뿌리원까지의 거리다. Face width는 축방향 치폭이며 치높이와 다르다.\n\n핵심 개념: 치끝·치뿌리·치면·치폭\n\n필수 영문 용어: Tip / Root / Flank / Face width / Addendum / Dedendum","표준 전위 0 스퍼기어의 기본 치끝높이는 m, 이뿌리높이는 통상 1.25m를 기준으로 하지만 공구·설계·규격에 따라 달라질 수 있다.","이끝원·기준원·이뿌리원을 도면에 서로 다른 선으로 표시해 본다."],["기어 맞물림과 백래시","기어 맞물림은 두 치면의 접촉으로 진행된다. Backlash는 맞물리는 치 사이의 원주방향 여유로 열팽창·윤활·제작오차를 고려해 설정한다. 백래시가 지나치게 작으면 발열·소착 위험이, 지나치게 크면 충격·소음·위치 정밀도 문제가 생길 수 있다.\n\n핵심 개념: 물림률·접촉·회전 방향\n\n필수 영문 용어: Backlash / Contact ratio / Meshing / Tooth contact","기어를 고정하고 상대 기어를 좌우로 미세하게 흔들 때 나타나는 자유 회전량은 백래시의 영향일 수 있으나 축·베어링 유격과 구분해야 한다.","백래시 측정 위치와 측정 방향을 명시하지 않은 수치는 비교하기 어렵다."]]],["기어 기하학","모듈, 압력각, 헬리컬, 전위와 중심거리",[["모듈과 원주피치","모듈 m은 기준원 직경 d를 잇수 z로 나눈 값이며 단위는 mm이다. 표준 평기어에서 d=mz, 원주피치 p=πm. 모듈이 같은 기어라도 잇수가 다르면 직경이 달라진다. 서로 맞물리는 평기어는 기본적으로 모듈과 압력각이 호환되어야 한다.\n\n핵심 개념: 기준원과 치 크기\n\n필수 영문 용어: Module / Number of teeth / Pitch circle / Circular pitch","m=2.5 mm, z=32이면 d=80 mm, p≈7.854 mm. z=48이면 같은 모듈에서 d=120 mm.","치끝원 지름을 기준원 지름과 혼동하지 않는다."],["압력각과 인벌류트","인벌류트는 기초원에서 팽팽한 줄을 풀어낼 때 줄 끝이 그리는 곡선으로 이해할 수 있다. 기준원 압력각 α와 기초원 직경 db의 관계는 db=d cosα이다. 압력각은 맞물림 하중의 방향, 기초원 크기, 접촉 특성에 영향을 준다.\n\n핵심 개념: 기초원에서 생성되는 치형\n\n필수 영문 용어: Involute / Base circle / Pressure angle / Line of action","d=100 mm, α=20°이면 db≈93.969 mm. 같은 d에서 압력각이 커질수록 기초원 직경은 감소한다.","압력각은 도면 또는 사양에 표시된 값을 사용한다."],["헬리컬 기어 기하학","헬리컬 기어의 치선은 축에 대해 β만큼 기울어져 있다. 법선 모듈 mn과 정면 모듈 mt는 mt=mn/cosβ, 기준원 직경 d=zmt이다. 법선 압력각 αn과 정면 압력각 αt는 tanαt=tanαn/cosβ 관계를 가진다.\n\n핵심 개념: 법선·정면 모듈과 나선 방향\n\n필수 영문 용어: Helix angle / Normal module / Transverse module / RH / LH","mn=2 mm, β=30°, z=30이면 mt≈2.3094 mm, d≈69.282 mm. mn을 그대로 mz에 넣으면 60 mm로 잘못 계산한다.","나선 방향과 공구 방향을 도면 기준으로 확인한다."],["전위기어와 중심거리","전위계수 x는 공구의 기준 위치를 이동해 치형·치두께·언더컷 특성을 조정하는 설계 변수다. 전위가 있으면 표준 전위 0의 치끝원 식을 무조건 적용할 수 없다. 표준 외접 평기어의 기준 중심거리 a=(d1+d2)/2이며 실제 작동 중심거리는 설계에 따라 달라진다.\n\n핵심 개념: 표준 치형의 한계와 보정\n\n필수 영문 용어: Profile shift / Center distance / Undercut / Tip diameter","m=2, z1=20, z2=40인 표준 전위 0 외접 평기어의 기준 중심거리는 60 mm다.","치끝원·중심거리 계산 시 전위와 설계 조건을 먼저 확인한다."]]],["도면과 정밀 측정","제원표, 치형·치선·피치, 측정기",[["기어 도면 독해","기어 도면에서 z, mn 또는 mt, αn 또는 αt, β, b, x, 손잡이 방향, 공차 및 열처리 조건을 읽는다. 기어 제원 표와 일반 기계 치수는 다른 의미를 가진다. 치형 측정값은 기준원·측정 범위·평가 규격을 동반해야 한다.\n\n핵심 개념: 기본 제원과 치수기입\n\n필수 영문 용어: Gear data table / Tolerance / Datum / Drawing revision","도면에 z=36, mn=2, β=0°라면 기준원 직경은 72 mm다. β=25°라면 72 mm가 아니다.","도면 리비전과 단위(mm, inch)를 먼저 확인한다."],["기어 정밀도와 측정 항목","Profile deviation은 치형 곡선의 편차, helix/lead deviation은 치폭 방향 치선의 편차, pitch deviation은 이 간격의 편차, radial runout은 회전 중심 대비 반경방향 흔들림을 뜻한다. 각각의 측정 항목은 다른 기하학적 특성을 평가한다.\n\n핵심 개념: 치형·치선·피치·런아웃\n\n필수 영문 용어: Profile / Lead / Pitch / Runout / Total indicator reading","치형 양호, 런아웃 불량이라면 척킹 편심·기준축·소재 동심도 등을 검토한다. 단일 결과로 원인을 확정하지 않는다.","측정기 교정 상태와 기준면을 반드시 기록한다."],["측정기와 게이지","다이얼게이지는 변위를 상대 측정한다. TIR은 최대 지시값에서 최소 지시값을 뺀 값이다. 마이크로미터는 길이 치수, 기어 측정기는 치형·치선·피치 등을 평가할 수 있다. 측정값의 신뢰도는 교정·접촉 방향·온도·측정자에 의존한다.\n\n핵심 개념: 다이얼게이지·마이크로미터·기어 측정기\n\n필수 영문 용어: Dial indicator / Micrometer / Calibration / Repeatability","최대 +0.024 mm, 최소 -0.016 mm이면 TIR=0.040 mm. 실제 형상오차가 포함될 수 있어 편심량을 무조건 TIR/2로 단정하면 안 된다.","측정값만 적지 말고 측정 위치·방향·온도를 기록한다."]]],["절삭 가공 기초","공정, 절삭조건, 채터와 공구마모",[["절삭 가공의 공정 흐름","소재 준비와 척킹 후 절삭·마무리·버 제거·검사를 수행한다. Roughing은 가공 여유를 빠르게 제거하는 단계, finishing은 치수·표면 품질을 확보하는 단계다. Burr는 절삭 가장자리의 돌출된 재료로 조립과 측정에 영향을 줄 수 있다.\n\n핵심 개념: 소재·황삭·정삭·버 제거\n\n필수 영문 용어: Blank / Workholding / Roughing / Finishing / Deburring","가공 직후 치끝에 버가 남으면 접촉 흔적·측정 결과가 왜곡될 수 있으므로 적절한 디버링 후 검사한다.","실제 공정 순서는 제품·공법·후열처리 여부에 따라 달라진다."],["절삭속도·이송·절입","Cutting speed Vc는 공구 절삭날의 상대 선속도(m/min), spindle speed n은 회전수(rpm), feed는 이송량 또는 이송속도, depth of cut은 절입량이다. 회전 공구의 대표 관계식은 Vc=πDn/1000(D mm)이다. 절삭 조건은 공구 수명·표면 품질·가공시간에 영향을 준다.\n\n핵심 개념: 가공조건의 단위와 상관관계\n\n필수 영문 용어: Cutting speed / RPM / Feed / Depth of cut / Tool life","공구 직경 80 mm, 회전수 600 rpm이면 Vc≈150.8 m/min. 공구가 마모되면 동일 조건에서도 절삭력과 발열이 증가할 수 있다.","기계·공구·소재 조건을 확인하지 않고 수치를 임의 적용하지 않는다."],["절삭력·채터·공구마모","Chatter는 절삭 중 진동이 증폭되어 표면에 흔적을 남기는 현상이다. Tool wear는 날끝 형상과 절삭 능력 변화를 뜻한다. 마모·강성·척킹·공구 돌출량·절삭 조건·공진이 서로 영향을 준다.\n\n핵심 개념: 가공면에서 원인 가설 만들기\n\n필수 영문 용어: Chatter / Vibration / Tool wear / Tool deflection","특정 회전수에서만 주기적 무늬가 심해지면 공진·진동을 의심하고 회전수별 현상을 기록한다.","진동 발생 시 무작정 회전수를 높이지 않는다."]]],["기어 절삭 공법","호빙, 파워 스카이빙, 셰이핑·브로칭·연삭",[["호빙의 원리","Hobbing은 웜 형태의 다날 공구인 hob과 소재의 동기 회전으로 치형을 창성한다. 호브 시작 수 S와 소재 잇수 z의 이상적 회전 관계는 n_work=n_hob×S/z이다. 실제 공정에서는 이송·헬릭스 보정이 포함된다.\n\n핵심 개념: 호브와 소재의 창성운동\n\n필수 영문 용어: Hob / Hob start / Generating / Axial feed / Climb cut","2-start hob 1000 rpm으로 50T 기어를 가공하면 이상적 소재 회전수는 40 rpm이다.","호브 시작 수를 날 수(flute 수)와 혼동하지 않는다."],["파워 스카이빙의 원리","Power skiving은 공구와 소재의 회전축에 교차각을 부여하고 두 회전을 동기화해 절삭속도를 얻는 창성 가공이다. 내치기어와 어깨부 근접 형상에 유리할 수 있다. 동기 관계와 공구·소재 간섭, 강성이 품질에 중요하다.\n\n핵심 개념: 교차각·동기·공구 접근\n\n필수 영문 용어: Crossing angle / Tool spindle / Work spindle / Synchronization","내치기어 가공 시 공구가 링 내부에 들어갈 수 있는지, 공구와 척의 간섭이 없는지 검토한다.","실제 동기비·교차각은 공구 설계와 기어 제원에 따라 정해진다."],["셰이핑·브로칭·연삭","Gear shaping은 왕복 운동하는 피니언형 공구로 치형을 창성한다. Broaching은 연속 치형을 가진 공구를 밀거나 당겨 형상을 가공한다. Gear grinding은 연삭숫돌로 높은 정밀도와 표면 품질을 얻는 마무리 공정이다.\n\n핵심 개념: 다른 기어 가공법과 비교\n\n필수 영문 용어: Shaping / Broaching / Grinding / Honing","내치기어의 대량 생산과 형상 제약을 비교할 때 브로칭의 전용 공구 비용과 스카이빙의 유연성을 함께 검토한다.","공법은 형상·수량·열처리·요구 정밀도에 따라 선택한다."]]],["열처리와 기계요소","열처리, 축·베어링·척킹",[["열처리와 마무리","Carburizing(침탄), quenching(담금질), tempering(뜨임), induction hardening(고주파 경화)은 목적과 적용 방식이 다르다. 열처리 후 변형이 생길 수 있어 연삭·호닝 등의 후공정을 고려한다. 경도와 표면 품질은 마모·피로수명에 영향을 준다.\n\n핵심 개념: 경도·변형·표면 품질\n\n필수 영문 용어: Carburizing / Quenching / Hardness / Grinding allowance","열처리 전 양품이었던 기어가 열처리 후 런아웃 불량이라면 변형 및 기준면 변화를 확인한다.","열처리 전후 검사 기준이 같은지 확인한다."],["축·베어링·척킹","Bearing은 회전축을 지지하고, chuck/fixture는 공작물을 고정한다. Runout, concentricity, alignment, rigidity는 각각 다른 개념이다. 기어 가공 정밀도는 기어 제원뿐 아니라 축·베어링·고정 반복성에도 영향을 받는다.\n\n핵심 개념: 기어 품질과 기계요소의 연결\n\n필수 영문 용어: Bearing / Chuck / Fixture / Alignment / Rigidity","재척킹 때마다 런아웃이 달라지면 공작물 고정면 오염, 척 조, 기준면 상태를 점검한다.","동일 기준에서 재현 측정을 수행한다."]]],["FSE 기본 역량","제어·설비 용어, 현장 관찰과 보고",[["기초 구동·설비 용어","CNC는 프로그램을 기반으로 축 운동을 제어하고, servo는 지령을 추종하도록 피드백 제어한다. PLC는 순차 제어·인터록을 담당한다. Hydraulics와 pneumatics는 각각 액체와 압축공기로 힘·운동을 전달한다. Lubrication은 마찰과 마모를 줄인다.\n\n핵심 개념: CNC·서보·PLC·윤활\n\n필수 영문 용어: CNC / Servo / Encoder / PLC / Hydraulics / Lubrication","지령 125.000 mm, 실제 124.965 mm이면 추종 편차는 0.035 mm다. 압력은 정상이어도 유량 부족으로 구동이 느릴 수 있다.","안전회로 우회나 임의 파라미터 변경은 금지한다."],["품질 이상 관찰과 보고","Symptom은 관찰된 현상, hypothesis는 원인 가설, root cause는 검증된 근본 원인, corrective action은 시정조치다. 정확한 보고서는 가공조건·측정 기준·수치·재현성·조치 전후 검증을 구분한다.\n\n핵심 개념: 증상·가설·검증·조치\n\n필수 영문 용어: Symptom / Root cause / Corrective action / Verification","'Chatter marks observed at 1200 rpm; spindle load and tool condition to be checked.'는 관찰과 확인 계획을 분리한다.","고객 정보와 장비 보안정보는 개인 학습 앱에 기록하지 않는다."]]]],"cases":[["기준원 직경","모듈 2.5 mm, 잇수 32인 평기어의 기준원 직경(mm)은?",80,0.01,"d=mz=2.5×32=80 mm."],["원주피치","모듈 2 mm의 원주피치(mm)는?",6.283,0.01,"p=πm=6.283 mm."],["헬리컬 기준원","법선 모듈 2 mm, 헬릭스각 30°, 잇수 30의 기준원 직경(mm)은?",69.282,0.02,"d=zmn/cosβ≈69.282 mm."],["중심거리","모듈 2, 잇수 20과 40의 표준 외접 평기어 기준 중심거리(mm)는?",60,0.01,"a=m(z1+z2)/2=60 mm."],["호빙 회전수","2-start 호브 1000 rpm, 소재 50T일 때 이상적 소재 회전수(rpm)는?",40,0.01,"1000×2/50=40 rpm."],["절삭속도","직경 80 mm 공구, 600 rpm의 절삭속도(m/min)는?",150.796,0.1,"Vc=πDn/1000≈150.796 m/min."],["런아웃","최대 +0.024 mm, 최소 -0.016 mm의 TIR(mm)은?",0.04,0.001,"TIR=0.024-(-0.016)=0.040 mm."],["기어비","20T 기어가 900 rpm일 때 맞물린 60T 기어 회전수(rpm)는?",300,0.01,"n2=n1 z1/z2=300 rpm."]],"quizzes":[["그림에서 외접 기어쌍의 회전방향은?",["같은 방향 function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="home")home();if(tab==="calc")calc();if(tab==="quiz")quiz();if(tab==="cases")cases();if(tab==="notes")notes();}
function home(){let n=Object.keys(done).filter(k=>done[k]).length,total=DATA.units.reduce((s,u)=>s+u[2].length,0);$("app").innerHTML='<div class="card"><b>학습 진도 '+n+'/'+total+'강의 ('+Math.round(100*n/total)+'%)</b><progress value="'+n+'" max="'+total+'"></progress><p class="muted">7개 단원 · '+total+'개 세부 강의 · 계산 실습 · 36문항 시각 평가</p></div>'+DATA.units.map((u,i)=>'<details '+(openUnit===i?'open':'')+' data-unit="'+i+'"><summary>'+(i+1)+'주차 · '+esc(u[0])+'<div class="muted">'+esc(u[1])+'</div></summary>'+u[2].map((l,j)=>'<div class="card"><span class="tag">강의 '+(j+1)+' · 일반 공학 원리 / 실무 적용</span><h3>'+esc(l[0])+'</h3><p>'+esc(l[1])+'</p><b>계산·적용 예제</b><p>'+esc(l[2])+'</p><b>현장 점검 관점</b><p>'+esc(l[3])+'</p><label><input type="checkbox" data-done="'+i+'-'+j+'" '+(done[i+'-'+j]?'checked':'')+' style="width:auto"> 이 강의 학습 완료</label></div>').join('')+'</details>').join('')+'<div class="card"><b>학습 자료 안내</b><p>일반 기어공학과 가공기술 학습용입니다. 실제 작업은 도면·공식 규격·장비별 매뉴얼을 우선합니다.</p></div>';}
function calc(){$("app").innerHTML='<h2>기어 계산 실습</h2><div class="card"><label>법선 모듈 mn (mm)<input id="mn" type="number" step="any" value="2"></label><label>잇수 z<input id="z" type="number" step="1" value="40"></label><label>헬릭스각 β (°)<input id="beta" type="number" step="any" value="0"></label><label>법선 압력각 αn (°)<input id="alpha" type="number" step="any" value="20"></label><button id="calculate" class="primary">계산하기</button><div id="result"></div></div><p class="muted">전위계수 0인 표준 스퍼/헬리컬 외접기어의 기준 치수 계산. 실제 치끝원과 이뿌리원은 전위·공구·설계에 따라 달라집니다.</p>';}

function visual(type){
let frame=(s,caption)=>'<div class="diagram" role="img" aria-label="'+esc(caption)+'"><svg viewBox="0 0 340 190" xmlns="http://www.w3.org/2000/svg">'+s+'</svg><small>'+esc(caption)+'</small></div>';
let gear=(x,y,r,n,fill)=>{let p=[];for(let i=0;i<n*4;i++){let a=-Math.PI/2+i*Math.PI/(n*2),rad=r*(i%4===1||i%4===2?1.12:1);p.push((x+Math.cos(a)*rad).toFixed(1)+','+(y+Math.sin(a)*rad).toFixed(1))}return '<polygon points="'+p.join(' ')+'" fill="'+fill+'" stroke="#a8d5ff" stroke-width="1.4"/><circle cx="'+x+'" cy="'+y+'" r="'+(r*.22)+'" fill="#101c30" stroke="#e6f3ff"/>'};
const line=(x1,y1,x2,y2,color='#a8d5ff',dash='')=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="2" '+(dash?'stroke-dasharray="'+dash+'"':'')+'/>';
const txt=(x,y,t)=>'<text x="'+x+'" y="'+y+'" fill="#dceeff" font-size="12" text-anchor="middle">'+t+'</text>';
if(type==='pair')return frame(gear(105,95,36,12,'#285e88')+gear(213,95,65,20,'#245079')+txt(105,157,'20T · Pinion')+txt(213,181,'60T · Gear')+txt(105,25,'↻')+txt(213,14,'↺'),'외접 기어쌍 개념도 · 크기·잇수는 설명용');
if(type==='circles')return frame(gear(170,94,66,20,'#295a7d')+'<circle cx="170" cy="94" r="66" fill="none" stroke="#ffd36f" stroke-width="2"/><circle cx="170" cy="94" r="57" fill="none" stroke="#b4f3a6" stroke-width="2" stroke-dasharray="5 4"/><circle cx="170" cy="94" r="47" fill="none" stroke="#ffa7b7" stroke-width="2"/>'+txt(65,34,'이끝원')+line(96,39,115,55,'#ffd36f')+txt(273,83,'기준원')+line(235,88,278,88,'#b4f3a6')+txt(271,140,'이뿌리원')+line(213,126,245,138,'#ffa7b7'),'기어의 이끝원·기준원·이뿌리원 모식도');
if(type==='helix')return frame('<path d="M80 40 L230 40 L260 70 L260 145 L110 145 L80 115Z" fill="#234b70" stroke="#a8d5ff" stroke-width="2"/>'+Array.from({length:8},(_,i)=>line(85+i*20,116,110+i*20,42,'#87c8ff')).join('')+line(72,160,265,160,'#ffe29b')+txt(170,180,'축 방향 →')+txt(277,40,'β'),'헬리컬 기어의 경사진 치선 모식도');
if(type==='shaft')return frame('<rect x="40" y="77" width="260" height="36" rx="7" fill="#6c8aa5" stroke="#d2e8ff"/><rect x="85" y="60" width="38" height="70" fill="#315c83" stroke="#a8d5ff"/><rect x="217" y="60" width="38" height="70" fill="#315c83" stroke="#a8d5ff"/>'+gear(170,95,32,12,'#32648b')+txt(104,47,'Bearing')+txt(236,47,'Bearing')+txt(170,160,'Shaft + Gear'),'기어·축·베어링 배치 모식도');
if(type==='gauge')return frame('<rect x="55" y="132" width="235" height="17" fill="#55748f"/><circle cx="155" cy="72" r="43" fill="#203d5a" stroke="#d9eaff" stroke-width="3"/>'+Array.from({length:12},(_,i)=>{let a=i*Math.PI/6;return line(155+33*Math.cos(a),72+33*Math.sin(a),155+38*Math.cos(a),72+38*Math.sin(a),'#eaf4ff')}).join('')+line(155,72,176,45,'#ffcb75')+line(155,115,155,132)+txt(155,78,'0.01')+txt(264,115,'TIR'),'다이얼게이지 측정 모식도');
if(type==='hobbing')return frame(gear(215,112,48,17,'#26587e')+'<g transform="rotate(-22 115 76)"><rect x="50" y="56" width="125" height="36" rx="12" fill="#427da5" stroke="#d2e9ff"/>'+Array.from({length:8},(_,i)=>line(55+i*16,57,65+i*16,92,'#dceeff')).join('')+'</g>'+txt(105,35,'Hob')+txt(237,180,'Workpiece'),'호브 공구와 공작물 창성 가공 모식도');
if(type==='skiving')return frame(gear(205,107,53,16,'#285b82')+'<g transform="rotate(-32 107 74)">'+gear(107,74,35,10,'#497fa3')+'</g>'+line(45,35,154,120,'#ffce80','5 4')+line(157,107,302,107,'#ffce80','5 4')+txt(100,160,'교차각 · 동기 회전'),'파워 스카이빙의 공구축 교차 개념도');
if(type==='internal')return frame('<circle cx="170" cy="94" r="78" fill="#2a567a" stroke="#d5eaff" stroke-width="2"/><circle cx="170" cy="94" r="58" fill="#0b1425" stroke="#a8d5ff" stroke-width="2"/>'+Array.from({length:24},(_,i)=>{let a=i*Math.PI/12;return line(170+58*Math.cos(a),94+58*Math.sin(a),170+47*Math.cos(a),94+47*Math.sin(a),'#9dd1ff')}).join('')+txt(170,98,'Internal')+txt(170,115,'gear'),'내치기어 · 치가 링 안쪽을 향함');
if(type==='rack')return frame('<path d="M25 138 L25 113 '+Array.from({length:12},(_,i)=>{let x=25+i*24;return 'L'+(x+5)+' 113 L'+(x+9)+' 91 L'+(x+17)+' 91 L'+(x+21)+' 113'}).join(' ')+' L315 113 L315 138 Z" fill="#376b90" stroke="#b5dcff" stroke-width="2"/>'+gear(164,61,38,12,'#2d5c7e')+txt(270,169,'Rack →')+txt(164,15,'Pinion'),'랙과 피니언의 운동 변환 모식도');
return '';
}

function quiz(){$("app").innerHTML='<h2>이해도 평가</h2><p>정답을 선택하면 즉시 채점하고 해설을 보여줍니다.</p>'+DATA.quizzes.map((q,i)=>'<div class="card"><b>Q'+(i+1)+'. '+esc(q[0])+'</b>'+visual(DATA.visuals[i])+q[1].map((o,j)=>'<p><button data-q="'+i+'" data-choice="'+j+'">'+String.fromCharCode(65+j)+'. '+esc(o)+'</button></p>').join('')+'<div id="ex'+i+'">'+(answers[i]===undefined?'':explain(i))+'</div></div>').join('')+'<div class="card" id="score"></div>';score();}
function explain(i){let q=DATA.quizzes[i],ok=answers[i]===q[2];return '<p class="'+(ok?'good':'bad')+'">'+(ok?'✓ 정답':'✕ 오답 · 정답 '+String.fromCharCode(65+q[2]))+'</p><div class="answer">'+esc(q[3])+'</div>';}
function score(){let a=Object.keys(answers).length,correct=DATA.quizzes.filter((q,i)=>answers[i]===q[2]).length;$("score").textContent="풀이 "+a+"/36 · 정답 "+correct+"개"+(a===36?" · 점수 "+Math.round(correct/36*100)+"점":"");}
function cases(){$("app").innerHTML='<h2>응용 계산 실습</h2><p>직접 수치를 입력하고 오차 범위 내에서 자동 채점합니다.</p>'+DATA.cases.map((c,i)=>'<div class="card"><span class="tag">계산형 '+(i+1)+'</span><h3>'+esc(c[0])+'</h3><p>'+esc(c[1])+'</p><input type="number" step="any" id="case'+i+'" placeholder="숫자로 답 입력"><button data-check="'+i+'">채점하기</button><div id="caseResult'+i+'"></div></div>').join('')+'<div class="card"><h3>FSE 진단 시나리오</h3><p>증상: 동일 공정에서 냉간에는 양품, 3시간 운전 후 치형·런아웃 편차가 증가. 먼저 확인할 데이터 3가지를 기록해 보세요.</p><textarea id="scenario" placeholder="예: 부품/척 온도, 런아웃 반복 측정, 가공 속도 및 서보 로그"></textarea><button id="showScenario">진단 기준 보기</button><div id="scenarioAnswer"></div></div>';}
function notes(){$("app").innerHTML='<h2>현장 학습 기록</h2><p>기밀 정보, 고객 정보, 실제 비밀번호는 입력하지 마세요.</p><textarea id="memo" placeholder="관찰 증상 / 측정값 / 가설 / 검증 / 결론"></textarea><button id="saveMemo">저장</button> <button id="copyMemo">기록 복사</button><div id="memoStatus" class="muted"></div>'; $("memo").value=memo;}
document.addEventListener("click",e=>{let t=e.target.closest("button");if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render();scrollTo(0,0);return}if(t.id==="calculate"){let mn=+$("mn").value,z=+$("z").value,b=+$("beta").value,a=+$("alpha").value;if(!(mn>0&&z>0&&z%1===0&&Math.abs(b)<85&&a>0&&a<45)){$("result").textContent="입력값을 확인하세요.";return}let mt=mn/Math.cos(b*Math.PI/180),d=mt*z,at=Math.atan(Math.tan(a*Math.PI/180)/Math.cos(b*Math.PI/180)),db=d*Math.cos(at);$("result").innerHTML='<div class="answer"><p>정면 모듈 mt = '+mt.toFixed(4)+' mm</p><p>기준원 직경 d = '+d.toFixed(4)+' mm</p><p>정면 압력각 αt = '+(at*180/Math.PI).toFixed(4)+'°</p><p>기초원 직경 db = '+db.toFixed(4)+' mm</p></div>';return}if(t.dataset.q!==undefined){let i=+t.dataset.q;answers[i]=+t.dataset.choice;put("answers",answers);$("ex"+i).innerHTML=explain(i);score();return}if(t.dataset.check!==undefined){let i=+t.dataset.check,c=DATA.cases[i],v=+$("case"+i).value,valid=$("case"+i).value.trim()!=="";let ok=valid&&Math.abs(v-c[2])<=c[3];$("caseResult"+i).innerHTML='<p class="'+(ok?'good':'bad')+'">'+(ok?'✓ 정답':'✕ 다시 확인')+'</p><div class="answer">'+esc(c[4])+'</div>';return}if(t.id==="showScenario"){$("scenarioAnswer").innerHTML='<div class="answer"><p>① 시간대별 장비·척·공작물 온도 ② 동일 기준에서의 런아웃 및 치형 반복 측정 ③ 동일 가공조건의 서보 추종·부하·윤활 상태 로그를 비교합니다. 열변형은 가설이며 확인 전 결론을 내리지 않습니다.</p></div>';return}if(t.id==="saveMemo"){memo=$("memo").value;$("memoStatus").textContent=put("memo",memo)?"이 기기에 저장했습니다.":"브라우저 저장 실패. 기록을 복사해 보관하세요.";return}if(t.id==="copyMemo"){let v=$("memo").value;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(()=>$("memoStatus").textContent="복사 완료").catch(()=>$("memoStatus").textContent="복사 권한이 없어 텍스트를 직접 선택해 주세요.")}else{$("memoStatus").textContent="텍스트를 길게 눌러 복사하세요."}return}});
document.addEventListener("change",e=>{if(e.target.dataset.done){done[e.target.dataset.done]=e.target.checked;put("done",done);let unit=e.target.closest("details");openUnit=unit?+unit.dataset.unit:-1;home()}});
document.addEventListener("toggle",e=>{if(e.target.matches&&e.target.matches("details[data-unit]")&&e.target.open)openUnit=+e.target.dataset.unit},true);
$("status").textContent="기어공학 심화 v4.0 · 기능 실행 정상 ✓";render();
</script></body></html>
