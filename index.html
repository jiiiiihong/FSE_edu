<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1425"><title>FSE Gear Academy · 실무 학습</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1425;color:#edf3ff;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}header{padding:28px 18px;background:linear-gradient(135deg,#18365b,#101c30)}h1{font-size:25px;margin:8px 0}h2{font-size:21px}p{line-height:1.75;color:#c6d2e5}main{max-width:780px;margin:auto;padding:16px 16px 95px}.card{background:#17263d;border:1px solid #314765;border-radius:16px;padding:18px;margin:12px 0}.muted{color:#9eb4d0;font-size:13px}.tag{display:inline-block;padding:4px 8px;background:#294a68;border-radius:8px;font-size:12px;margin:5px 0}.btn,button{border:1px solid #5c83ac;background:#254467;color:white;border-radius:10px;padding:11px 13px;font-size:15px;cursor:pointer}.btn:active,button:active{background:#386995}.primary{background:#3b76b0}nav{position:fixed;bottom:0;left:0;right:0;background:#13243a;border-top:1px solid #35506c;display:flex;justify-content:space-around;padding:10px 3px max(14px,env(safe-area-inset-bottom))}nav button{border:0;background:none;font-size:13px;padding:8px 4px}nav button.active{color:#89d0ff}input,textarea{width:100%;padding:12px;background:#0c192b;color:white;border:1px solid #496383;border-radius:10px;font:inherit;margin:6px 0}textarea{min-height:150px}details{background:#17263d;border:1px solid #314765;border-radius:13px;padding:15px;margin:10px 0}summary{font-weight:700;cursor:pointer}small{color:#aabbd1}.answer{border-left:3px solid #7bbaf0;padding:8px 12px;background:#10223b}.good{color:#87e5b0}.bad{color:#ffb3a9}progress{width:100%;height:14px}a{color:#94d4ff}#status{font-size:12px;color:#9bcfff}</style></head><body><header><small>개인 학습용 · 비공식 교육 자료</small><h1>⚙️ FSE Gear Academy</h1><p style="margin:3px 0">100PS Universal · Gear Engineering & Service</p><div id="status">실무 교육 v3.0 · 로딩 중</div></header><main id="app"><div class="card">학습 자료를 불러오는 중입니다.</div></main><nav><button data-tab="home" class="active">📚 과정</button><button data-tab="calc">🧮 계산</button><button data-tab="quiz">📝 평가</button><button data-tab="cases">🔎 사례</button><button data-tab="notes">📓 기록</button></nav><script>
"use strict";
const DATA={"units":[["기어 기하학","모듈·압력각·인벌류트·정밀도",[["모듈과 기준원","표준 외접 스퍼기어의 기준원 직경 d=mz, 원주피치 p=πm, 표준 전치 높이의 이끝원 직경 da=m(z+2). 이끝원 식은 표준 치형·전위계수 0의 가정입니다. 모듈은 치 크기이고 잇수는 원주 분할 수입니다.","m=2 mm, z=40이면 d=80 mm, p≈6.283 mm, da=84 mm. 도면의 전위계수 x가 0인지 먼저 확인하세요.","피치원 직경이 예상과 다르면 모듈 단위, 법선/정면 모듈, 전위 유무부터 확인합니다."],["압력각과 인벌류트","인벌류트는 기초원에서 풀리는 팽팽한 줄 끝점의 궤적입니다. 표준 인벌류트 스퍼기어의 기초원 직경 db=d cosα. 압력각이 커지면 기초원이 작아지고 맞물림 힘의 반경 방향 성분이 증가할 수 있습니다.","d=80 mm, α=20°일 때 db≈75.175 mm. tan20°≈0.364로 치면 법선력의 반경 성분을 이해합니다.","압력각은 공구 및 도면 사양과 일치해야 합니다. 20°를 모든 기어에 강제 적용하지 않습니다."],["헬리컬 기어와 기준","헬리컬 기어는 법선 모듈 mn과 정면 모듈 mt를 구분합니다. mt=mn/cosβ, d=zmt. β=0°이면 스퍼기어입니다. 법선 압력각과 정면 압력각도 구분해야 합니다.","mn=2 mm, β=30°, z=30이면 mt≈2.309 mm, d≈69.282 mm.","도면의 mn을 그대로 d=mz에 대입하면 직경 오차가 발생합니다."],["정밀도 평가","치형(profile), 리드/치선(lead), 피치(pitch), 런아웃(runout)은 서로 다른 오류입니다. 런아웃은 편심·척킹 영향, 피치 오차는 분할·동기 문제, 치형 오차는 공구·설정·변형 등 복합 원인일 수 있습니다.","기준 런아웃 0.010 mm, 실측 0.045 mm이면 초과량은 0.035 mm입니다. 합격 여부는 해당 도면 공차로 판정합니다.","측정기 교정, 기준축, 클램핑 반복성, 온도, 측정 셋업을 먼저 검증하세요."]]],["절삭 공법","Hobbing·Power Skiving·공법 선정",[["호빙의 생성 원리","호빙은 웜 형태의 호브와 소재의 동기 회전으로 치형을 생성합니다. 단시작 호브의 이상적 속도비는 공작물 회전수=호브 회전수/잇수입니다. 실제 가공에는 이송·헬릭스 보정이 더해집니다.","단시작 호브 1200 rpm, z=40이면 이상적 소재 회전수 30 rpm.","호브 시작 수, 회전 방향, 헬릭스 보정, 가공 프로그램을 분리 확인합니다."],["파워 스카이빙","공구와 소재 회전축에 교차각을 부여하고 동기 회전시키며 축방향 이송으로 절삭합니다. 내치기어 및 간섭 형상에 유리할 수 있으나 공구·척킹·동기 정밀도와 강성이 중요합니다.","불량이 회전 동기 이상과 동반되면 엔코더·서보 추종·동기 설정 로그를 우선 비교합니다.","공구 간섭, 공구 마모, 절삭 조건을 기계 이상과 혼동하지 않습니다."],["공법 선택","호빙은 외치기어 대량 생산에 흔히 효율적이고, 스카이빙은 내치·어깨부 근접 형상에서 이점이 있습니다. 형상, 오버런, 강성, 생산량으로 선택합니다.","샤프트 어깨에 인접한 작은 기어를 가공할 때 공구 접근 공간과 오버런을 검토합니다.","100PS Universal의 호빙 옵션 장착 여부를 장비별로 확인합니다."]]],["100PS Universal","공식 사양과 현장 구조",[["공식 공개 사양","Gleason 공개 자료상 100PS는 수평 공작물 축을 채택하며 최대 모듈 2.5 mm, 외치기어 소재 최대 직경 100 mm를 제시합니다. 옵션에 따라 내치기어 가공 범위가 달라집니다.","내치기어 swing diameter 180/240 mm 및 tip diameter 150/200 mm는 옵션 구분을 동반합니다.","공식 공개값은 개별 장비의 설치 옵션·허용 조건을 대체하지 않습니다."],["Universal 구성 변경","제조사 공개 설명에 따르면 Universal 옵션은 스카이빙에서 호빙으로 전환 가능하며 호브, counter bearing, sealing air, workholding 구성이 관여합니다.","호빙 전환 후 진동이 늘면 지지 베어링 체결과 공구 지지 강성을 점검 대상으로 기록합니다.","실제 조립·전환은 현장 절차서와 권한을 가진 작업자만 수행합니다."],["기계축과 정렬","직선축·회전축의 역할은 실제 장비의 CNC 축 명칭과 기계도면으로 매핑해야 합니다. 백래시, 가이드 마모, 열변위, 클램핑 편심이 정확도에 영향을 줍니다.","동일 부품 반복 클램핑 후 런아웃 값이 달라지는지 측정 기록을 비교합니다.","기종 일반론을 실제 축 이름이나 제조사 허용 오차로 오인하지 않습니다."]]],["CNC와 서보","위치 루프·동기·Following Error",[["폐루프 제어","CNC 위치 지령 → 서보 제어기 → 모터/기계 → 엔코더 피드백 구조입니다. Following error는 지령 위치와 실제 위치의 차이이며 부하·가속도·튜닝·기계 저항에 영향받습니다.","지령 125.000 mm, 실제 124.965 mm이면 위치 편차는 0.035 mm입니다.","알람 발생 전후의 축·속도·부하·온도·시간 정보를 함께 보존합니다."],["동기 회전 진단","기어 생성 공정은 공구축과 소재축의 정확한 운동 관계가 필수입니다. 동기 오차는 피치 품질에 영향을 줄 수 있습니다.","특정 속도에서만 품질이 나빠지면 속도 의존적 진동, 제어 추종, 공구 조건을 분리합니다.","원인 미확정 상태에서 서보 파라미터를 임의 변경하지 않습니다."],["원인 분리 실험","기계적 마찰·열팽창·엔코더 이상·서보 설정은 비슷한 증상을 만들 수 있습니다. 재현 조건과 변경 변수 1개 원칙이 중요합니다.","냉간/열간 추종오차를 같은 이동거리·속도로 비교합니다.","안전 인터록 우회나 생산 중 위험한 시험은 금지합니다."]]],["PLC와 전기","인터록·센서·전기도면",[["PLC 시퀀스","입력 센서 → PLC 논리 → 출력 명령 → 구동기 응답 → 완료 피드백 순서로 추적합니다. 화면 알람은 원인이 아니라 결과일 수 있습니다.","척 클램프 완료가 안 뜨면 압력, 솔레노이드 출력, 센서 입력, 배선 순서로 가설을 세웁니다.","실제 I/O 주소와 시퀀스는 해당 기계의 회로도 및 PLC 문서로 확인합니다."],["전기적 진단","24 VDC 센서 계통에서 공급 전압, 공통선, 입력단 상태를 구분합니다. 출력이 ON이어도 액추에이터가 동작하지 않을 수 있습니다.","PLC 출력 ON, 코일 전압 0 V이면 출력 이후 배선/보호소자 경로를 조사합니다.","전기 측정은 자격과 현장 안전절차를 준수하고 무전압 확인을 우선합니다."],["안전회로","E-stop, 도어 인터록, STO는 목적과 동작이 다릅니다. 안전 기능의 리셋 조건은 설계에 따라 다릅니다.","도어 닫힘 신호와 안전회로 정상 신호가 서로 다를 수 있음을 진단표에 구분합니다.","안전회로 점퍼·우회·강제 출력은 하지 않습니다."]]],["유압·공압·윤활","압력·유량·온도·오염",[["유압 기초","압력은 힘/면적 P=F/A, 유량은 속도와 관련됩니다. 압력이 정상이어도 유량 부족으로 응답이 느릴 수 있습니다.","피스톤 유효면적 10 cm², 압력 5 MPa라면 이론 힘 5000 N(손실 무시).","실제 압력 설정값은 장비 회로도·제조사 절차서로 확인합니다."],["공압과 sealing air","공압은 클램프·액추에이터 등에 쓰이고 sealing air는 오염 유입 방지 용도로 쓰일 수 있습니다. 압력 저하와 수분·필터 오염은 고장을 유발합니다.","압력 정상인데 동작 지연 시 유량 제한, 밸브, 실린더 마찰, 센서 지연을 구분합니다.","에어 차단 및 잔압 해제는 승인된 LOTO 절차를 따릅니다."],["윤활과 열","윤활 부족·오일 점도·필터 막힘·냉각 이상은 온도 상승과 마모를 유발할 수 있습니다.","온도 상승 후에만 치수 편차가 증가하면 열변위와 윤활 상태를 함께 추적합니다.","오일 종류·교환주기·경보 임계치는 현장 매뉴얼 기준입니다."]]],["정밀도와 보전","측정계획·원인-결과 연결",[["런아웃 측정","다이얼게이지의 TIR은 최대값-최소값입니다. 편심만 있는 이상적 원형의 경우 편심량 e≈TIR/2지만 실제 형상오차가 있으면 단순 환산하면 안 됩니다.","측정 최대 +0.018, 최소 -0.012 mm이면 TIR=0.030 mm.","기준면, 회전축, 게이지 접촉 방향, 반복 측정값을 기록합니다."],["오차 패턴 해석","치형 오차·리드 오차·피치 오차·런아웃은 구분하고 가공품과 공정 데이터를 함께 봅니다.","리드 기울기만 변화했다면 축 정렬, 공구 셋업, 열변형 등을 가설로 분류합니다.","단일 측정 결과로 부품 교체를 결정하지 않습니다."],["예방보전 계획","고장 이력·주기·중요도·검사 비용을 고려해 보전 항목을 설계합니다.","일별 누유 확인, 주별 필터 차압 추적, 월별 반복정밀도 비교 등은 예시이며 실제 주기는 매뉴얼 기준입니다.","검사 후 원상복구 및 기록을 표준화합니다."]]],["FSE 종합 진단","현장 시나리오·보고서",[["알람 진단 절차","증상 정의 → 안전 확인 → 재현 조건 → 로그/측정 확보 → 가설 우선순위 → 단일 변수 검증 → 재시험 → 보고서 작성 순으로 진행합니다.","Following error가 고속 이송에서만 증가한다면 부하, 마찰, 가속도, 드라이브 로그를 비교합니다.","알람 코드의 의미는 실제 CNC 매뉴얼에서 확인합니다."],["절삭 품질 불량 사례","피치 오차 증가와 척 교체 시점이 겹친다면 동기 제어뿐 아니라 공작물 고정 반복성을 검증해야 합니다.","동일 부품 3회 재척킹 런아웃 측정 후 산포를 계산하고 교체 전 이력과 비교합니다.","상관관계만으로 원인을 확정하지 않습니다."],["서비스 보고서","문제·장비 조건·측정값·조치·검증·잔여 리스크를 분리 기록합니다.","증상: 냉간 정상/열간 불량. 가설: 열변위. 검증: 온도와 런아웃 동시 기록. 결론은 데이터 확보 후 기재.","검증 전 임시조치를 영구 해결로 보고하지 않습니다."]]]],"cases":[["치형 치수 계산","법선 모듈 2 mm, 헬릭스각 30°, 잇수 30의 피치원 직경(mm)을 구하세요.",69.282,0.02,"mt=mn/cosβ, d=z·mt. 2/0.8660254×30≈69.282 mm."],["런아웃 평가","다이얼게이지 최대값 +0.022 mm, 최소값 -0.014 mm의 TIR(mm)을 구하세요.",0.036,0.001,"TIR=최대-최소=0.022-(-0.014)=0.036 mm."],["서보 추종오차","지령 200.000 mm, 실제 199.958 mm이면 오차의 절댓값(mm)은?",0.042,0.001,"|200.000-199.958|=0.042 mm. 오차 방향도 별도 기록합니다."],["유압 힘","유효면적 12 cm²에 4 MPa가 걸릴 때 이론 힘(N)은?",4800,1,"12 cm²=0.0012 m². F=PA=4,000,000×0.0012=4800 N."]],"quizzes":[["스퍼기어 m=2, z=40의 기준원 직경은? ",["40 mm","80 mm","84 mm"],1,"d=mz=80 mm."],["헬리컬 기어에서 mn과 mt 관계는?",["mt=mn cosβ","mt=mn/cosβ","mt=mn+β"],1,"정면 모듈 mt=mn/cosβ."],["인벌류트 기초원 직경 식은?",["db=d cosα","db=d/sinα","db=d+2m"],0,"기초원은 기준원보다 작거나 같습니다."],["런아웃과 관련성이 높은 현장 요인은?",["척킹 편심","화면 밝기","문서 언어"],0,"척킹 반복성, 기준축, 소재 편심을 우선 확인합니다."],["호빙에서 단시작 호브 1200 rpm, 잇수 40이면 이상적 소재 rpm은?",["30","40","1200"],0,"1200/40=30 rpm, 헬릭스·이송 보정 제외."],["Power Skiving 공정의 핵심은?",["공구/소재 동기 회전과 교차각","공구 정지","열처리만 수행"],0,"상대 회전과 축 교차각으로 절삭합니다."],["100PS Universal에 대한 제조사 공개 설명은?",["모든 장비에 호빙 기본 장착","Universal 옵션으로 호빙 전환 가능","외치만 가공 가능"],1,"옵션 적용 여부는 현장 기계별 확인합니다."],["서보 Following Error는?",["지령과 실제 위치의 차이","유압 탱크 용량","공구 직경"],0,"동일 시점의 지령값과 피드백을 비교합니다."],["PLC 출력 ON, 코일 전압 0 V일 때 우선 가설은?",["배선/전원 경로","모듈 값 오류","기어 잇수 오류"],0,"출력 이후 전원·보호소자·배선 확인이 우선입니다."],["안전 인터록 이상 시 올바른 대응은?",["점퍼 우회","승인 절차에 따른 진단","강제 출력"],1,"안전기능 우회는 금지합니다."],["압력이 정상인데 액추에이터가 느릴 때 고려할 것은?",["유량·밸브·마찰","오직 압력계 교체","기어 압력각"],0,"압력과 유량은 다른 변수입니다."],["유압 5 MPa, 면적 10 cm² 이론 힘은?",["500 N","5000 N","50000 N"],1,"5e6×0.001=5000 N."],["TIR 정의는?",["최대 측정값 - 최소 측정값","측정값 평균","최대값/2"],0,"TIR은 최대-최소입니다."],["품질 불량 원인을 확정하기 전 우선할 것은?",["재현 조건과 측정계 검증","임의 파라미터 변경","모터 교체"],0,"측정 신뢰성과 조건 통제가 우선입니다."],["서비스 보고서의 핵심은?",["검증 결과 포함","추측만 기재","조치 내역 생략"],0,"증상·데이터·조치·검증을 구분합니다."]]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=(k,f)=>{try{return JSON.parse(localStorage.getItem("fse3_"+k))??f}catch(e){return f}};
const put=(k,v)=>{try{localStorage.setItem("fse3_"+k,JSON.stringify(v));return true}catch(e){return false}};
let tab="home",openUnit=-1,answers=get("answers",{}),done=get("done",{}),memo=get("memo",""),caseAnswers={};
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="home")home();if(tab==="calc")calc();if(tab==="quiz")quiz();if(tab==="cases")cases();if(tab==="notes")notes();}
function home(){let n=Object.keys(done).filter(k=>done[k]).length,total=DATA.units.reduce((s,u)=>s+u[2].length,0);$("app").innerHTML='<div class="card"><b>학습 진도 '+n+'/'+total+'강의 ('+Math.round(100*n/total)+'%)</b><progress value="'+n+'" max="'+total+'"></progress><p class="muted">8개 단원 · '+total+'개 세부 강의 · 계산 실습 · 15문항 평가</p></div>'+DATA.units.map((u,i)=>'<details '+(openUnit===i?'open':'')+' data-unit="'+i+'"><summary>'+(i+1)+'주차 · '+esc(u[0])+'<div class="muted">'+esc(u[1])+'</div></summary>'+u[2].map((l,j)=>'<div class="card"><span class="tag">강의 '+(j+1)+' · 일반 공학 원리 / 실무 적용</span><h3>'+esc(l[0])+'</h3><p>'+esc(l[1])+'</p><b>계산·적용 예제</b><p>'+esc(l[2])+'</p><b>현장 점검 관점</b><p>'+esc(l[3])+'</p><label><input type="checkbox" data-done="'+i+'-'+j+'" '+(done[i+'-'+j]?'checked':'')+' style="width:auto"> 이 강의 학습 완료</label></div>').join('')+'</details>').join('')+'<div class="card"><b>자료 구분</b><p>일반 공학 원리와 Gleason 공개 확인 사양을 구분합니다. 실제 축 이름, 압력, 공차, 경보 코드, 안전 절차는 현장 장비 매뉴얼로 확인해야 합니다.</p><a href="https://www.gleason.com/pt/products/machines/cylindrical/power-skiving/100ps-the-solution-for-shafts-and-small-internal-external-gears" target="_blank" rel="noopener">Gleason 100PS 제조사 공개 자료 ↗</a></div>';}
function calc(){$("app").innerHTML='<h2>기어 계산 실습</h2><div class="card"><label>법선 모듈 mn (mm)<input id="mn" type="number" step="any" value="2"></label><label>잇수 z<input id="z" type="number" step="1" value="40"></label><label>헬릭스각 β (°)<input id="beta" type="number" step="any" value="0"></label><label>법선 압력각 αn (°)<input id="alpha" type="number" step="any" value="20"></label><button id="calculate" class="primary">계산하기</button><div id="result"></div></div><p class="muted">전위계수 0인 표준 스퍼/헬리컬 외접기어의 기준 치수 계산. 실제 치끝원과 이뿌리원은 전위·공구·설계에 따라 달라집니다.</p>';}
function quiz(){$("app").innerHTML='<h2>이해도 평가</h2><p>정답을 선택하면 즉시 채점하고 해설을 보여줍니다.</p>'+DATA.quizzes.map((q,i)=>'<div class="card"><b>Q'+(i+1)+'. '+esc(q[0])+'</b>'+q[1].map((o,j)=>'<p><button data-q="'+i+'" data-choice="'+j+'">'+String.fromCharCode(65+j)+'. '+esc(o)+'</button></p>').join('')+'<div id="ex'+i+'">'+(answers[i]===undefined?'':explain(i))+'</div></div>').join('')+'<div class="card" id="score"></div>';score();}
function explain(i){let q=DATA.quizzes[i],ok=answers[i]===q[2];return '<p class="'+(ok?'good':'bad')+'">'+(ok?'✓ 정답':'✕ 오답 · 정답 '+String.fromCharCode(65+q[2]))+'</p><div class="answer">'+esc(q[3])+'</div>';}
function score(){let a=Object.keys(answers).length,correct=DATA.quizzes.filter((q,i)=>answers[i]===q[2]).length;$("score").textContent="풀이 "+a+"/15 · 정답 "+correct+"개"+(a===15?" · 점수 "+Math.round(correct/15*100)+"점":"");}
function cases(){$("app").innerHTML='<h2>수치 계산 실습</h2><p>직접 수치를 입력하고 오차 범위 내에서 자동 채점합니다.</p>'+DATA.cases.map((c,i)=>'<div class="card"><span class="tag">계산형 '+(i+1)+'</span><h3>'+esc(c[0])+'</h3><p>'+esc(c[1])+'</p><input type="number" step="any" id="case'+i+'" placeholder="숫자로 답 입력"><button data-check="'+i+'">채점하기</button><div id="caseResult'+i+'"></div></div>').join('')+'<div class="card"><h3>FSE 진단 시나리오</h3><p>증상: 동일 공정에서 냉간에는 양품, 3시간 운전 후 치형·런아웃 편차가 증가. 먼저 확인할 데이터 3가지를 기록해 보세요.</p><textarea id="scenario" placeholder="예: 부품/척 온도, 런아웃 반복 측정, 가공 속도 및 서보 로그"></textarea><button id="showScenario">진단 기준 보기</button><div id="scenarioAnswer"></div></div>';}
function notes(){$("app").innerHTML='<h2>현장 학습 기록</h2><p>기밀 정보, 고객 정보, 실제 비밀번호는 입력하지 마세요.</p><textarea id="memo" placeholder="관찰 증상 / 측정값 / 가설 / 검증 / 결론"></textarea><button id="saveMemo">저장</button> <button id="copyMemo">기록 복사</button><div id="memoStatus" class="muted"></div>'; $("memo").value=memo;}
document.addEventListener("click",e=>{let t=e.target.closest("button");if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render();scrollTo(0,0);return}if(t.id==="calculate"){let mn=+$("mn").value,z=+$("z").value,b=+$("beta").value,a=+$("alpha").value;if(!(mn>0&&z>0&&z%1===0&&Math.abs(b)<85&&a>0&&a<45)){$("result").textContent="입력값을 확인하세요.";return}let mt=mn/Math.cos(b*Math.PI/180),d=mt*z,at=Math.atan(Math.tan(a*Math.PI/180)/Math.cos(b*Math.PI/180)),db=d*Math.cos(at);$("result").innerHTML='<div class="answer"><p>정면 모듈 mt = '+mt.toFixed(4)+' mm</p><p>기준원 직경 d = '+d.toFixed(4)+' mm</p><p>정면 압력각 αt = '+(at*180/Math.PI).toFixed(4)+'°</p><p>기초원 직경 db = '+db.toFixed(4)+' mm</p></div>';return}if(t.dataset.q!==undefined){let i=+t.dataset.q;answers[i]=+t.dataset.choice;put("answers",answers);$("ex"+i).innerHTML=explain(i);score();return}if(t.dataset.check!==undefined){let i=+t.dataset.check,c=DATA.cases[i],v=+$("case"+i).value,valid=$("case"+i).value.trim()!=="";let ok=valid&&Math.abs(v-c[2])<=c[3];$("caseResult"+i).innerHTML='<p class="'+(ok?'good':'bad')+'">'+(ok?'✓ 정답':'✕ 다시 확인')+'</p><div class="answer">'+esc(c[4])+'</div>';return}if(t.id==="showScenario"){$("scenarioAnswer").innerHTML='<div class="answer"><p>① 시간대별 장비·척·공작물 온도 ② 동일 기준에서의 런아웃 및 치형 반복 측정 ③ 동일 가공조건의 서보 추종·부하·윤활 상태 로그를 비교합니다. 열변형은 가설이며 확인 전 결론을 내리지 않습니다.</p></div>';return}if(t.id==="saveMemo"){memo=$("memo").value;$("memoStatus").textContent=put("memo",memo)?"이 기기에 저장했습니다.":"브라우저 저장 실패. 기록을 복사해 보관하세요.";return}if(t.id==="copyMemo"){let v=$("memo").value;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(()=>$("memoStatus").textContent="복사 완료").catch(()=>$("memoStatus").textContent="복사 권한이 없어 텍스트를 직접 선택해 주세요."))}else{$("memoStatus").textContent="텍스트를 길게 눌러 복사하세요."}return}});
document.addEventListener("change",e=>{if(e.target.dataset.done){done[e.target.dataset.done]=e.target.checked;put("done",done);let unit=e.target.closest("details");openUnit=unit?+unit.dataset.unit:-1;home()}});
document.addEventListener("toggle",e=>{if(e.target.matches&&e.target.matches("details[data-unit]")&&e.target.open)openUnit=+e.target.dataset.unit},true);
$("status").textContent="실무 교육 v3.0 · 기능 실행 정상 ✓";render();
</script></body></html>
