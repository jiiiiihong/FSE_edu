<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1425"><title>FSE Gear Academy · 기어·가공 기초</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1425;color:#edf3ff;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}header{padding:28px 18px;background:linear-gradient(135deg,#18365b,#101c30)}h1{font-size:25px;margin:8px 0}h2{font-size:21px}p{line-height:1.75;color:#c6d2e5}main{max-width:780px;margin:auto;padding:16px 16px 95px}.card{background:#17263d;border:1px solid #314765;border-radius:16px;padding:18px;margin:12px 0}.muted{color:#9eb4d0;font-size:13px}.tag{display:inline-block;padding:4px 8px;background:#294a68;border-radius:8px;font-size:12px;margin:5px 0}.btn,button{border:1px solid #5c83ac;background:#254467;color:white;border-radius:10px;padding:11px 13px;font-size:15px;cursor:pointer}.btn:active,button:active{background:#386995}.primary{background:#3b76b0}nav{position:fixed;bottom:0;left:0;right:0;background:#13243a;border-top:1px solid #35506c;display:flex;justify-content:space-around;padding:10px 3px max(14px,env(safe-area-inset-bottom))}nav button{border:0;background:none;font-size:13px;padding:8px 4px}nav button.active{color:#89d0ff}input,textarea{width:100%;padding:12px;background:#0c192b;color:white;border:1px solid #496383;border-radius:10px;font:inherit;margin:6px 0}textarea{min-height:150px}details{background:#17263d;border:1px solid #314765;border-radius:13px;padding:15px;margin:10px 0}summary{font-weight:700;cursor:pointer}small{color:#aabbd1}.answer{border-left:3px solid #7bbaf0;padding:8px 12px;background:#10223b}.good{color:#87e5b0}.bad{color:#ffb3a9}progress{width:100%;height:14px}a{color:#94d4ff}#status{font-size:12px;color:#9bcfff}</style></head><body><header><small>개인 학습용 · 비공식 교육 자료</small><h1>⚙️ FSE Gear Academy</h1><p style="margin:3px 0">100PS Universal · Gear Engineering & Service</p><div id="status">기어·가공 기초 v3.1 · 로딩 중</div></header><main id="app"><div class="card">학습 자료를 불러오는 중입니다.</div></main><nav><button data-tab="home" class="active">📚 과정</button><button data-tab="calc">🧮 계산</button><button data-tab="quiz">📝 평가</button><button data-tab="cases">🔎 사례</button><button data-tab="notes">📓 기록</button></nav><script>
"use strict";
const DATA={"units":[["기어 용어 입문","기어의 종류·구성요소·현장 영문 용어",[["기어의 역할과 종류","Gear는 회전력과 회전속도를 전달합니다. Spur gear(평기어), Helical gear(헬리컬), Internal gear(내치기어), Bevel gear(베벨), Worm gear(웜)를 구분합니다. Pinion은 맞물리는 한 쌍에서 작은 기어를 가리키는 경우가 일반적입니다.","예제: 외치기어 20T와 60T가 맞물리면 속도비는 3:1이며 작은 쪽이 900 rpm이면 큰 쪽은 이상적으로 300 rpm입니다.","도면에서 external/internal, pinion/gear, driving/driven을 구별합니다."],["기어 각부 명칭","Tooth(이), tooth flank(치면), tooth root(치근), addendum(이끝높이), dedendum(이뿌리높이), face width(치폭), pitch circle(기준원), base circle(기초원), backlash(백래시)를 익힙니다.","예제: 백래시는 한 쌍의 맞물림에서 운동 방향 반전 시 나타나는 치면 간 유격이며 축 자체의 백래시와 구분합니다.","도면 치폭 b, 잇수 z, 모듈 m을 직접 표시해 봅니다."],["치형과 맞물림","Involute(인벌류트) 치형은 일정한 압력각과 속도비 전달을 돕습니다. Contact ratio(물림률)는 평균적으로 동시에 맞물리는 치쌍 수와 관련됩니다.","예제: 물림률 1.5는 평균적으로 약 1.5쌍의 치가 하중을 나눠 갖는다는 뜻입니다.","치면 접촉 흔적과 소음은 정렬·윤활·부하와 함께 판단합니다."]]],["기어 기하학과 계산","모듈·잇수·압력각·헬릭스각",[["모듈과 기준원","표준 외접 스퍼기어에서 d=mz, 원주피치 p=πm. m은 모듈(mm), z는 잇수, d는 기준원 직경입니다.","m=2 mm, z=40이면 d=80 mm, p≈6.283 mm.","법선/정면 모듈 혼동을 피하고 전위계수도 확인합니다."],["압력각과 기초원","Pressure angle(압력각) α, base circle(기초원) db=d cosα. 압력각은 치면 접촉 힘의 방향과 관계가 있습니다.","d=80 mm, α=20°이면 db≈75.175 mm.","도면의 20° 표기를 관습으로 추정하지 않고 명시값을 확인합니다."],["헬리컬 기어","Helix angle(헬릭스각) β, normal module(법선 모듈) mn, transverse module(정면 모듈) mt. mt=mn/cosβ, d=zmt.","mn=2 mm, β=30°, z=30이면 d≈69.282 mm.","LH/RH helix(좌·우 나선), 공구 회전 방향, 헬릭스각 기준을 확인합니다."]]],["기어 도면과 품질 용어","도면 기호·공차·검사 보고서",[["도면 읽기","Drawing에는 잇수 z, 모듈 mn/mt, 압력각 α, 헬릭스각 β, 치폭 b, 전위계수 x, 정밀도 등급 및 공차가 제시될 수 있습니다.","예제: mn=2, β=0, z=40이면 스퍼기어 기준원 80 mm. β≠0이면 정면 모듈로 변환합니다.","검사 성적서의 기준면과 측정조건을 먼저 확인합니다."],["치형·치선·피치","Profile deviation(치형 편차), helix/lead deviation(치선 편차), pitch deviation(피치 편차), runout(런아웃)을 구분합니다.","예제: 치선 오차가 증가하면 축 정렬·공구 셋업·열변형을 가설로 세웁니다.","각 편차는 원인과 일대일 대응하지 않습니다."],["런아웃과 백래시","Runout은 회전 기준에 대한 흔들림, TIR은 최대 측정값-최소 측정값입니다. Backlash는 치면 사이의 유격입니다.","최대 +0.018 mm, 최소 -0.012 mm이면 TIR=0.030 mm.","측정 기준, 척킹, 다이얼게이지 접촉 방향을 기록합니다."]]],["기어 가공 기초","절삭 용어·공정 순서·절삭 조건",[["절삭 공정의 흐름","Blank(소재) 준비 → Workholding(척킹) → Roughing(황삭) → Finishing(정삭) → Deburring(디버링) → Inspection(검사) 순서가 일반적입니다. 실제 공정은 제품마다 다릅니다.","예제: 버가 남으면 치형 검사 및 조립 시 간섭을 유발할 수 있습니다.","공정표와 작업지시서에서 실제 공정 순서를 확인합니다."],["절삭 조건의 용어","Cutting speed Vc(절삭속도), spindle speed n(주축 회전수), feed f(이송), depth of cut ap(절입량), tool wear(공구 마모), chatter(채터)를 구분합니다.","Vc=πDn/1000 (D mm, n rpm, Vc m/min). D=50 mm, n=1000 rpm이면 약 157.1 m/min.","공구 제조사 조건과 소재, 강성, 냉각 상태를 함께 검토합니다."],["가공 불량의 표현","Burr(버), chatter mark(채터 흔적), tool wear(공구 마모), surface finish(표면 조도), dimensional deviation(치수 편차)를 익힙니다.","예제: 표면에 주기적 줄무늬가 보이면 진동, 공구 날 상태, 가공조건을 구분해 조사합니다.","외관 불량을 곧바로 서보 불량으로 판단하지 않습니다."]]],["호빙과 파워 스카이빙","가공 원리·차이·현장 용어",[["Hobbing(호빙)","Hob(호브)와 소재의 동기 회전으로 기어를 창성합니다. 호브 시작 수에 따라 이상적 회전비가 달라집니다.","단시작 호브 1200 rpm, 40T 소재면 이상적 소재 회전수 30 rpm(보정 제외).","Hob start(호브 시작 수), axial feed(축방향 이송), climb/conventional cutting 용어를 익힙니다."],["Power Skiving(파워 스카이빙)","공구와 소재 회전축에 교차각(crossing angle)을 주고 동기 회전해 절삭합니다. 내치기어와 간섭 형상에 활용됩니다.","예제: 내치기어의 공구 접근·충돌 여유와 공구 돌출량을 확인합니다.","Tool spindle(공구 주축), work spindle(공작물 주축), synchronization(동기)을 구분합니다."],["호빙과 스카이빙 비교","호빙은 외치기어 대량 가공에 흔히 사용되고 스카이빙은 내치·어깨부 인접 형상에 유리할 수 있습니다. 기계 강성·공구 비용·형상이 공법 선택을 좌우합니다.","예제: 어깨부 근접 샤프트 가공에서 공구 오버런 공간을 검토합니다.","공법마다 절삭 조건·지지 구조·간섭 위험이 다릅니다."]]],["100PS Universal 이해","장비 구조와 공정 용어",[["100PS 공개 개요","100PS는 Gleason의 소형 기어 및 샤프트 대상 Power Skiving 솔루션입니다. 공개 사양상 최대 모듈 2.5 mm, 외치기어 소재 최대 직경 100 mm 등이 제시됩니다.","예제: 제품이 100 mm를 넘는다면 개별 장비 구성 및 제조사 허용 범위를 확인합니다.","공개 사양과 고객 장비의 옵션·실제 한계는 구분합니다."],["Universal 옵션","제조사 공개 자료는 Universal 구성을 통한 호빙 전환을 설명합니다. Hob, counter bearing, workholding, sealing air 등 용어를 익힙니다.","예제: 전환 후 진동이 생기면 공구 지지·척킹·조건 변경을 기록합니다.","전환 작업은 현장 공식 절차와 안전 승인에 따릅니다."],["기계 기본 구성","Spindle(주축), axis(축), guideway(가이드), encoder(엔코더), chuck(척), coolant(절삭유), lubrication(윤활)을 구분합니다.","예제: 소재 흔들림은 척킹 문제인지 주축 문제인지 측정 기준을 나누어 확인합니다.","실제 축 명칭·부품 위치는 해당 기계 도면에서 확인합니다."]]],["FSE 기초 제어·설비 용어","CNC·서보·PLC·유공압",[["CNC와 Servo","CNC(수치제어), servo drive(서보 드라이브), motor(모터), encoder(엔코더), following error(추종오차)를 익힙니다.","지령 125.000 mm, 실제 124.965 mm이면 추종 편차 0.035 mm.","알람 전후의 속도·부하·온도·시간을 기록합니다."],["PLC와 인터록","PLC는 입력 신호와 제어 논리로 출력을 결정합니다. Sensor(센서), solenoid(솔레노이드), interlock(인터록), E-stop(비상정지), STO(안전 토크 차단)를 구분합니다.","예제: 척 클램프 완료 미검출 시 입력 센서, 압력, 밸브 상태를 단계별로 점검합니다.","안전회로 우회·강제 출력은 하지 않습니다."],["유압·공압·윤활","Hydraulics(유압), pneumatics(공압), pressure(압력), flow(유량), filter(필터), lubrication(윤활), sealing air(실링 에어)를 익힙니다.","면적 10 cm², 압력 5 MPa의 이론 힘은 5000 N입니다.","압력 정상이어도 유량 부족이 가능하며 현장 설정값은 매뉴얼을 따릅니다."]]],["기초 진단과 현장 영어","고장 설명·기록·보고",[["증상과 원인 구분","Symptom(증상), root cause(근본 원인), reproducibility(재현성), corrective action(시정조치), verification(검증)을 구분합니다.","예제: 냉간 정상·열간 불량이면 온도와 정밀도 데이터를 같은 시간축에 기록합니다.","추측은 가설로 표기하고 측정으로 확인합니다."],["현장 측정 용어","Dial indicator(다이얼게이지), calibration(교정), tolerance(공차), alignment(정렬), repeatability(반복정밀도)를 익힙니다.","예제: 동일 부품 3회 재척킹 후 TIR을 비교해 반복성을 평가합니다.","측정기 교정 상태·측정 기준·단위를 기록합니다."],["서비스 보고서 작성","Problem description(문제 설명), findings(확인 사항), action taken(수행 조치), test result(시험 결과), recommendation(권고)를 구분합니다.","예제: 'Vibration observed at 1500 rpm; further measurement required.'는 관찰과 추가 필요사항을 분리합니다.","검증 전 임시조치를 최종 해결로 표현하지 않습니다."]]]],"cases":[["치형 치수 계산","법선 모듈 2 mm, 헬릭스각 30°, 잇수 30의 피치원 직경(mm)을 구하세요.",69.282,0.02,"mt=mn/cosβ, d=z·mt. 2/0.8660254×30≈69.282 mm."],["런아웃 평가","다이얼게이지 최대값 +0.022 mm, 최소값 -0.014 mm의 TIR(mm)을 구하세요.",0.036,0.001,"TIR=최대-최소=0.022-(-0.014)=0.036 mm."],["서보 추종오차","지령 200.000 mm, 실제 199.958 mm이면 오차의 절댓값(mm)은?",0.042,0.001,"|200.000-199.958|=0.042 mm. 오차 방향도 별도 기록합니다."],["유압 힘","유효면적 12 cm²에 4 MPa가 걸릴 때 이론 힘(N)은?",4800,1,"12 cm²=0.0012 m². F=PA=4,000,000×0.0012=4800 N."]],"quizzes":[["Pinion은 일반적으로 무엇을 의미하나요?",["작은 쪽 기어","항상 구동 기어","항상 내치기어"],0,"한 쌍에서 작은 기어를 pinion이라 부르는 경우가 일반적입니다."],["Tooth flank의 뜻은?",["치면","축 끝","베어링"],0,"치면은 맞물림이 일어나는 이의 측면입니다."],["Backlash의 뜻은?",["치면 사이 유격","절삭유 온도","기초원"],0,"기어 맞물림 유격을 의미합니다."],["모듈 m=2, 잇수 z=40이면 기준원 직경은?",["20 mm","80 mm","42 mm"],1,"d=mz=80 mm."],["헬리컬 기어 정면 모듈 mt는?",["mn/cosβ","mn×cosβ","mn+β"],0,"mt=mn/cosβ."],["Pressure angle의 한국어는?",["헬릭스각","압력각","절입각"],1,"Pressure angle은 압력각입니다."],["Runout을 측정할 때 TIR은?",["최대값-최소값","최대값/2","평균값"],0,"TIR은 Total Indicator Reading입니다."],["Lead/helix deviation은 주로 무엇을 나타내나요?",["치선 방향 편차","공구 가격","전압"],0,"치선 편차는 치폭 방향의 기하학적 오차입니다."],["Deburring은 무엇인가요?",["버 제거","황삭","주축 교정"],0,"Deburring은 버 제거 공정입니다."],["Chatter는 무엇인가요?",["절삭 진동","유압 오일","잇수"],0,"Chatter는 절삭 중 진동과 흔적을 의미합니다."],["Hobbing의 기본 원리는?",["호브와 소재 동기 회전","공구 고정","열처리"],0,"호브와 소재의 창성 운동입니다."],["Power Skiving의 특징은?",["교차각과 동기 회전","공구 정지","연삭숫돌만 사용"],0,"공구와 소재 회전축의 교차각을 이용합니다."],["Workholding의 의미는?",["공작물 고정","서보 튜닝","알람 초기화"],0,"척·지그 등을 통한 소재 고정입니다."],["Following error의 뜻은?",["지령과 실제 위치 차이","유량","치폭"],0,"위치 추종 편차입니다."],["Root cause의 의미는?",["근본 원인","이뿌리 원","공구 교환"],0,"고장 분석에서 root cause는 근본 원인입니다."]]};

const put=(k,v)=>{try{localStorage.setItem("fse3_"+k,JSON.stringify(v));return true}catch(e){return false}};
let tab="home",openUnit=-1,answers=get("answers",{}),done=get("done",{}),memo=get("memo",""),caseAnswers={};
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="home")home();if(tab==="calc")calc();if(tab==="quiz")quiz();if(tab==="cases")cases();if(tab==="notes")notes();}
function home(){let n=Object.keys(done).filter(k=>done[k]).length,total=DATA.units.reduce((s,u)=>s+u[2].length,0);$("app").innerHTML='<div class="card"><b>학습 진도 '+n+'/'+total+'강의 ('+Math.round(100*n/total)+'%)</b><progress value="'+n+'" max="'+total+'"></progress><p class="muted">8개 단원 · '+total+'개 세부 강의 · 계산 실습 · 15문항 평가</p></div>'+DATA.units.map((u,i)=>'<details '+(openUnit===i?'open':'')+' data-unit="'+i+'"><summary>'+(i+1)+'주차 · '+esc(u[0])+'<div class="muted">'+esc(u[1])+'</div></summary>'+u[2].map((l,j)=>'<div class="card"><span class="tag">강의 '+(j+1)+' · 일반 공학 원리 / 실무 적용</span><h3>'+esc(l[0])+'</h3><p>'+esc(l[1])+'</p><b>계산·적용 예제</b><p>'+esc(l[2])+'</p><b>현장 점검 관점</b><p>'+esc(l[3])+'</p><label><input type="checkbox" data-done="'+i+'-'+j+'" '+(done[i+'-'+j]?'checked':'')+' style="width:auto"> 이 강의 학습 완료</label></div>').join('')+'</details>').join('')+'<div class="card"><b>자료 구분</b><p>일반 공학 원리와 Gleason 공개 확인 사양을 구분합니다. 실제 축 이름, 압력, 공차, 경보 코드, 안전 절차는 현장 장비 매뉴얼로 확인해야 합니다.</p><a href="https://www.gleason.com/pt/products/machines/cylindrical/power-skiving/100ps-the-solution-for-shafts-and-small-internal-external-gears" target="_blank" rel="noopener">Gleason 100PS 제조사 공개 자료 ↗</a></div>';}
function calc(){$("app").innerHTML='<h2>기어 계산 실습</h2><div class="card"><label>법선 모듈 mn (mm)<input id="mn" type="number" step="any" value="2"></label><label>잇수 z<input id="z" type="number" step="1" value="40"></label><label>헬릭스각 β (°)<input id="beta" type="number" step="any" value="0"></label><label>법선 압력각 αn (°)<input id="alpha" type="number" step="any" value="20"></label><button id="calculate" class="primary">계산하기</button><div id="result"></div></div><p class="muted">전위계수 0인 표준 스퍼/헬리컬 외접기어의 기준 치수 계산. 실제 치끝원과 이뿌리원은 전위·공구·설계에 따라 달라집니다.</p>';}
function quiz(){$("app").innerHTML='<h2>이해도 평가</h2><p>정답을 선택하면 즉시 채점하고 해설을 보여줍니다.</p>'+DATA.quizzes.map((q,i)=>'<div class="card"><b>Q'+(i+1)+'. '+esc(q[0])+'</b>'+q[1].map((o,j)=>'<p><button data-q="'+i+'" data-choice="'+j+'">'+String.fromCharCode(65+j)+'. '+esc(o)+'</button></p>').join('')+'<div id="ex'+i+'">'+(answers[i]===undefined?'':explain(i))+'</div></div>').join('')+'<div class="card" id="score"></div>';score();}
function explain(i){let q=DATA.quizzes[i],ok=answers[i]===q[2];return '<p class="'+(ok?'good':'bad')+'">'+(ok?'✓ 정답':'✕ 오답 · 정답 '+String.fromCharCode(65+q[2]))+'</p><div class="answer">'+esc(q[3])+'</div>';}
function score(){let a=Object.keys(answers).length,correct=DATA.quizzes.filter((q,i)=>answers[i]===q[2]).length;$("score").textContent="풀이 "+a+"/15 · 정답 "+correct+"개"+(a===15?" · 점수 "+Math.round(correct/15*100)+"점":"");}
function cases(){$("app").innerHTML='<h2>수치 계산 실습</h2><p>직접 수치를 입력하고 오차 범위 내에서 자동 채점합니다.</p>'+DATA.cases.map((c,i)=>'<div class="card"><span class="tag">계산형 '+(i+1)+'</span><h3>'+esc(c[0])+'</h3><p>'+esc(c[1])+'</p><input type="number" step="any" id="case'+i+'" placeholder="숫자로 답 입력"><button data-check="'+i+'">채점하기</button><div id="caseResult'+i+'"></div></div>').join('')+'<div class="card"><h3>FSE 진단 시나리오</h3><p>증상: 동일 공정에서 냉간에는 양품, 3시간 운전 후 치형·런아웃 편차가 증가. 먼저 확인할 데이터 3가지를 기록해 보세요.</p><textarea id="scenario" placeholder="예: 부품/척 온도, 런아웃 반복 측정, 가공 속도 및 서보 로그"></textarea><button id="showScenario">진단 기준 보기</button><div id="scenarioAnswer"></div></div>';}
function notes(){$("app").innerHTML='<h2>현장 학습 기록</h2><p>기밀 정보, 고객 정보, 실제 비밀번호는 입력하지 마세요.</p><textarea id="memo" placeholder="관찰 증상 / 측정값 / 가설 / 검증 / 결론"></textarea><button id="saveMemo">저장</button> <button id="copyMemo">기록 복사</button><div id="memoStatus" class="muted"></div>'; $("memo").value=memo;}
document.addEventListener("click",e=>{let t=e.target.closest("button");if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render();scrollTo(0,0);return}if(t.id==="calculate"){let mn=+$("mn").value,z=+$("z").value,b=+$("beta").value,a=+$("alpha").value;if(!(mn>0&&z>0&&z%1===0&&Math.abs(b)<85&&a>0&&a<45)){$("result").textContent="입력값을 확인하세요.";return}let mt=mn/Math.cos(b*Math.PI/180),d=mt*z,at=Math.atan(Math.tan(a*Math.PI/180)/Math.cos(b*Math.PI/180)),db=d*Math.cos(at);$("result").innerHTML='<div class="answer"><p>정면 모듈 mt = '+mt.toFixed(4)+' mm</p><p>기준원 직경 d = '+d.toFixed(4)+' mm</p><p>정면 압력각 αt = '+(at*180/Math.PI).toFixed(4)+'°</p><p>기초원 직경 db = '+db.toFixed(4)+' mm</p></div>';return}if(t.dataset.q!==undefined){let i=+t.dataset.q;answers[i]=+t.dataset.choice;put("answers",answers);$("ex"+i).innerHTML=explain(i);score();return}if(t.dataset.check!==undefined){let i=+t.dataset.check,c=DATA.cases[i],v=+$("case"+i).value,valid=$("case"+i).value.trim()!=="";let ok=valid&&Math.abs(v-c[2])<=c[3];$("caseResult"+i).innerHTML='<p class="'+(ok?'good':'bad')+'">'+(ok?'✓ 정답':'✕ 다시 확인')+'</p><div class="answer">'+esc(c[4])+'</div>';return}if(t.id==="showScenario"){$("scenarioAnswer").innerHTML='<div class="answer"><p>① 시간대별 장비·척·공작물 온도 ② 동일 기준에서의 런아웃 및 치형 반복 측정 ③ 동일 가공조건의 서보 추종·부하·윤활 상태 로그를 비교합니다. 열변형은 가설이며 확인 전 결론을 내리지 않습니다.</p></div>';return}if(t.id==="saveMemo"){memo=$("memo").value;$("memoStatus").textContent=put("memo",memo)?"이 기기에 저장했습니다.":"브라우저 저장 실패. 기록을 복사해 보관하세요.";return}if(t.id==="copyMemo"){let v=$("memo").value;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(()=>$("memoStatus").textContent="복사 완료").catch(()=>$("memoStatus").textContent="복사 권한이 없어 텍스트를 직접 선택해 주세요.")}else{$("memoStatus").textContent="텍스트를 길게 눌러 복사하세요."}return}});
document.addEventListener("change",e=>{if(e.target.dataset.done){done[e.target.dataset.done]=e.target.checked;put("done",done);let unit=e.target.closest("details");openUnit=unit?+unit.dataset.unit:-1;home()}});
document.addEventListener("toggle",e=>{if(e.target.matches&&e.target.matches("details[data-unit]")&&e.target.open)openUnit=+e.target.dataset.unit},true);
$("status").textContent="기어·가공 기초 v3.1 · 기능 실행 정상 ✓";render();
</script></body></html>
