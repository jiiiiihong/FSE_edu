name: Academy v2 verification (no deployment)
on:
  pull_request:
  push:
    branches: ['feature/gear-academy-v2-engineering']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:syntax
      - run: node scripts/check-ui-v1.6.mjs
      - run: npm run test:unit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academy-v2-browser-evidence
          path: |
            playwright-report/
            test-results/
      - name: Package complete static preview
        run: |
          mkdir -p preview/content preview/docs
          cp index.html legacy.html *.js *.mjs *.css preview/
          cp content/curriculum.json preview/content/
          cp docs/*.md preview/docs/
          cp PREVIEW-TESTING.md preview/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: academy-v2-static-preview
          path: preview/
