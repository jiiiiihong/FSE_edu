name: Legacy v1.6 Chromium regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:syntax
      - run: node scripts/check-ui-v1.6.mjs
      - run: npm run test:e2e -- tests/academy.spec.mjs tests/v16-smoke.spec.js --project=chromium-desktop --project=mobile-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: playwright-report/
